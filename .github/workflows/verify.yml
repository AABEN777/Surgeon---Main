name: Verify

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - discover-chain-ids
          - test-adapters
      target:
        description: "Optional: chain key (base, solana...) or a contract address"
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python3 -c "
          import ast, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path('.').rglob('*.py')):
              try:
                  ast.parse(p.read_text()); print('OK   ', p)
              except SyntaxError as e:
                  bad = 1; print('FAIL ', p, e)
          sys.exit(bad)
          "

      - name: Discover chain identifiers
        if: inputs.task == 'both' || inputs.task == 'discover-chain-ids'
        run: python3 discover_chain_ids.py

      - name: Test adapters
        if: inputs.task == 'both' || inputs.task == 'test-adapters'
        run: python3 test_adapters.py ${{ inputs.target }}
